<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>受賞・入賞作品 | どらねこ Doraneko</title>
<meta name="description" content="どらねこ（Doraneko）のAIアート・小説・短歌などの受賞・入賞作品をまとめたページです。">
<meta property="og:type" content="website">
<meta property="og:title" content="受賞・入賞作品 | どらねこ Doraneko">
<meta property="og:description" content="AIアート・小説・短歌などの受賞・入賞作品のまとめ。">
<meta property="og:image" content="icon.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@doraneko840">
<meta name="theme-color" content="#e8471c">
<link rel="icon" href="icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #dfe9f2;
    --bg-bottom: #a9c3d9;
    --card: rgba(255, 255, 255, 0.92);
    --tile: #ffffff;
    --ink: #2b2f36;
    --muted: #7a828e;
    --accent: #e8471c;
    --accent-soft: #fde6dd;
    --gold: #b8892b;
    --gold-soft: #f7efd9;
    --line: rgba(43, 47, 54, 0.08);
    --shadow: 0 6px 24px rgba(40, 70, 100, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #1b2430;
      --bg-bottom: #0e141c;
      --card: rgba(30, 38, 50, 0.9);
      --tile: #26303d;
      --ink: #eef1f5;
      --muted: #9aa4b1;
      --accent-soft: #3a2620;
      --gold: #d8b25a;
      --gold-soft: #3a3220;
      --line: rgba(255, 255, 255, 0.08);
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background:
      radial-gradient(ellipse at 50% 110%, rgba(255,255,255,0.55), transparent 60%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Zen Maru Gothic", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px 48px;
  }

  .snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .snow i { position: absolute; top: -10px; border-radius: 50%; background: rgba(255,255,255,.85); animation: fall linear infinite; }
  @keyframes fall { to { transform: translate(var(--drift), 105vh); } }
  @media (prefers-reduced-motion: reduce) { .snow { display: none; } }

  main {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    background: var(--card);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 24px 20px 28px;
  }

  .back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 6px 2px;
  }
  .back:hover { color: var(--accent); }

  header { text-align: center; margin: 8px 0 20px; }
  .mini-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    margin: 0 auto 10px; overflow: hidden;
    background: var(--accent-soft); display: grid; place-items: center; font-size: 28px;
    box-shadow: var(--shadow);
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    margin: 0;
    font-family: "M PLUS Rounded 1c", "Zen Maru Gothic", sans-serif;
    font-weight: 800; font-size: 24px; letter-spacing: 0.04em;
  }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; letter-spacing: 0.12em; }

  /* 集計 */
  .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 6px; }
  .stat {
    min-width: 92px; padding: 10px 12px; border-radius: 12px; text-align: center;
    background: var(--gold-soft); color: var(--gold);
  }
  .stat b { display: block; font-size: 22px; line-height: 1.1; }
  .stat span { font-size: 11px; letter-spacing: .08em; }

  /* 絞り込み */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 18px 0 20px; }
  .filters button {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 6px 14px; border-radius: 999px;
    background: var(--tile); color: var(--ink);
    border: 1px solid var(--line);
  }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 作品カード */
  .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }

  .work {
    background: var(--tile); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(40,70,100,.06);
    display: flex; flex-direction: column;
  }
  .thumb {
    position: relative; aspect-ratio: 4 / 3; background: var(--accent-soft);
    border: 0; padding: 0; width: 100%; cursor: zoom-in; display: block;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.noimg { cursor: default; display: grid; place-items: center; font-size: 36px; aspect-ratio: 16 / 6; }
  .badge {
    position: absolute; left: 10px; top: 10px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--gold); color: #fff; font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .cat { color: var(--accent); font-weight: 700; }
  .work h2 { margin: 0; font-size: 17px; line-height: 1.5; }
  .contest { margin: 0; font-size: 13px; color: var(--ink); }
  .note { margin: 2px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .more {
    margin-top: auto; align-self: flex-start;
    font-size: 13px; color: var(--accent); text-decoration: none; padding-top: 6px;
  }
  .more:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* 拡大表示 */
  dialog {
    border: 0; padding: 0; background: transparent; max-width: 94vw; max-height: 92vh;
  }
  dialog::backdrop { background: rgba(10, 15, 22, .85); }
  dialog img { max-width: 94vw; max-height: 84vh; display: block; border-radius: 10px; }
  dialog p { color: #fff; text-align: center; margin: 10px 0 0; font-size: 14px; }
  dialog button {
    position: fixed; top: 14px; right: 14px;
    width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.9); font-size: 20px; cursor: pointer;
  }

  footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="snow" aria-hidden="true" id="snow"></div>

  <main>
    <a class="back" href="./">‹ リンク集へ戻る</a>

    <header>
      <div class="mini-avatar" aria-hidden="true"><img src="icon.jpg" alt="" onerror="this.parentNode.textContent='🐟';"></div>
      <h1>受賞・入賞作品</h1>
      <p class="sub">AWARDS &amp; SELECTIONS</p>
    </header>

    <div class="stats" id="stats"></div>
    <div class="filters" id="filters" role="group" aria-label="ジャンルで絞り込み"></div>

    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>該当する作品はまだありません。</p>

    <footer>© どらねこ Doraneko ／ 掲載作品の無断転載はご遠慮ください。</footer>
  </main>

  <dialog id="viewer">
    <button type="button" aria-label="閉じる" id="close">×</button>
    <img id="viewer-img" alt="">
    <p id="viewer-cap"></p>
  </dialog>

<script>
/* =========================================================
   ▼ ここに作品を書き足していきます（新しいものを上に）
   ---------------------------------------------------------
   title    : 作品名
   category : ジャンル（AIアート／小説／短歌 など自由。同じ言葉で揃えると絞り込みボタンになります）
   award    : 賞の名前（例：入選、佳作、最優秀賞）
   contest  : コンテスト名
   date     : 発表日（例：2026-11-30）
   image    : 画像ファイル（images フォルダに入れてファイル名を書く。無ければ ""）
   url      : 結果発表ページや作品ページのURL（無ければ ""）
   note     : ひとこと説明（無ければ ""）
   ※ 下の2件は書き方の見本です。実際の作品に書き換えるか、削除してください。
   ========================================================= */
const WORKS = [
  {
    title: "（見本）作品名をここに",
    category: "AIアート",
    award: "入選",
    contest: "コンテスト名をここに",
    date: "2026-11-30",
    image: "images/sample.jpg",
    url: "",
    note: "金線画シリーズの一枚。制作の狙いなどをひとことで。"
  },
  {
    title: "（見本）小説・短歌の場合",
    category: "小説",
    award: "佳作",
    contest: "コンテスト名をここに",
    date: "2026-09-01",
    image: "",
    url: "",
    note: "画像がない作品は、アイコンの代わりに絵文字が表示されます。"
  },
];
/* ===================== ▲ ここまで ===================== */

(function () {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const filters = document.getElementById('filters');
  const stats = document.getElementById('stats');
  const viewer = document.getElementById('viewer');
  const vImg = document.getElementById('viewer-img');
  const vCap = document.getElementById('viewer-cap');
  const icons = { "AIアート": "🎨", "小説": "📖", "短歌": "🌸" };

  const works = WORKS.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const cats = [...new Set(works.map(w => w.category).filter(Boolean))];

  // 集計
  const addStat = (num, label) => {
    const d = document.createElement('div');
    d.className = 'stat';
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = num;
    d.querySelector('span').textContent = label;
    stats.appendChild(d);
  };
  addStat(works.length, '受賞・入賞');
  cats.forEach(c => addStat(works.filter(w => w.category === c).length, c));

  // 日付表示
  const fmt = s => {
    const m = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/.exec(s || '');
    return m ? `${m[1]}年${+m[2]}月${m[3] ? +m[3] + '日' : ''}` : (s || '');
  };

  // 絞り込みボタン
  let current = 'すべて';
  ['すべて', ...cats].forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = c;
    b.setAttribute('aria-pressed', c === current);
    b.addEventListener('click', () => {
      current = c;
      filters.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    });
    filters.appendChild(b);
  });
  if (cats.length < 2) filters.hidden = true;

  function card(w) {
    const li = document.createElement('li');
    li.className = 'work';

    const thumb = document.createElement(w.image ? 'button' : 'div');
    thumb.className = 'thumb' + (w.image ? '' : ' noimg');
    if (w.image) {
      thumb.type = 'button';
      thumb.setAttribute('aria-label', `${w.title} を拡大表示`);
      const img = document.createElement('img');
      img.src = w.image; img.alt = w.title; img.loading = 'lazy';
      img.onerror = () => { thumb.classList.add('noimg'); img.remove(); thumb.prepend(icons[w.category] || '🏅'); thumb.disabled = true; };
      thumb.appendChild(img);
      thumb.addEventListener('click', () => {
        vImg.src = w.image; vImg.alt = w.title;
        vCap.textContent = `${w.title} ／ ${w.contest} ${w.award}`;
        viewer.showModal();
      });
    } else {
      thumb.textContent = icons[w.category] || '🏅';
    }
    if (w.award) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '🏆 ' + w.award;
      thumb.appendChild(badge);
    }
    li.appendChild(thumb);

    const body = document.createElement('div');
    body.className = 'body';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<span class="cat"></span><span class="date"></span>';
    meta.querySelector('.cat').textContent = w.category || '';
    meta.querySelector('.date').textContent = fmt(w.date);
    body.appendChild(meta);

    const h = document.createElement('h2'); h.textContent = w.title; body.appendChild(h);
    if (w.contest) { const p = document.createElement('p'); p.className = 'contest'; p.textContent = w.contest; body.appendChild(p); }
    if (w.note) { const p = document.createElement('p'); p.className = 'note'; p.textContent = w.note; body.appendChild(p); }
    if (w.url) {
      const a = document.createElement('a');
      a.className = 'more'; a.href = w.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '結果発表・作品ページを見る ›';
      body.appendChild(a);
    }
    li.appendChild(body);
    return li;
  }

  function render() {
    grid.innerHTML = '';
    const list = works.filter(w => current === 'すべて' || w.category === current);
    list.forEach(w => grid.appendChild(card(w)));
    empty.hidden = list.length > 0;
  }
  render();

  // 拡大表示を閉じる
  document.getElementById('close').addEventListener('click', () => viewer.close());
  viewer.addEventListener('click', e => { if (e.target === viewer) viewer.close(); });

  // 雪
  const box = document.getElementById('snow');
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('i');
    const size = 2 + Math.random() * 5;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.opacity = 0.4 + Math.random() * 0.6;
    s.style.animationDuration = 8 + Math.random() * 12 + 's';
    s.style.animationDelay = -Math.random() * 20 + 's';
    s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
